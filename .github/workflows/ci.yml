
name: Task Manager CI

on:
  push:
    branches: [main, feature/docker]
  pull_request:
    branches: [main, feature/docker]

jobs:
  laravel:
    name: Laravel Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, xml, curl, zip

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  go-backend:
    name: Go Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Run Go tests
        working-directory: GoBackend
        run: go test ./...
