

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmanager-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      GO_API_URL: http://go-backend:8081
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - laravel_sqlite:/var/www/database
      - public_assets:/var/www/public
    depends_on:
      go-backend:
        condition: service_healthy
    command: >
      sh -c "touch database/database.sqlite &&
      php artisan package:discover --ansi &&
      php artisan migrate --force &&
      php-fpm"

  web:
    image: nginx:1.27-alpine
    container_name: taskmanager-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - public_assets:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  go-backend:
    build:
      context: ./GoBackend
      dockerfile: Dockerfile
    container_name: taskmanager-go
    restart: unless-stopped
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  laravel_sqlite:
  public_assets:
